# Spec V4.3.3 quality gate (§29.1) through KaririCode Devkit with the root
# configs (ADR-015). Actions and the service image are pinned by commit SHA
# and digest (§32; OWASP Top 10:2025 A03, CVE-2025-30066); kcode is pinned
# by version and SHA-256, and devkit.php pins the tools it installs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KCODE_VERSION: 1.2.1
  KCODE_SHA256: 1bc43b06798b4e7fc1df341cc505f316549f0dd5efb9c8d80031415b0cdf3e3b

jobs:
  gate:
    name: Gate · PHP 8.4 · Redis 7.4
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KARIRICODE_CACHE_REDIS_HOST: 127.0.0.1
      KARIRICODE_CACHE_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: redis, apcu, igbinary, zlib
          ini-values: apc.enable_cli=1
          coverage: pcov
          tools: none

      - name: Install the runtime (kariricode/contract, psr/clock)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install kcode ${{ env.KCODE_VERSION }}, checksum verified
        run: |
          curl -fsSLo kcode.phar "https://github.com/KaririCode-PHP/devkit/releases/download/v${KCODE_VERSION}/kcode.phar"
          echo "${KCODE_SHA256}  kcode.phar" | sha256sum -c -
          sudo install -m 0755 kcode.phar /usr/local/bin/kcode

      - name: Install the toolchain pinned in devkit.php
        run: kcode init

      - name: Style, PHPStan (+ strict, cognitive), Psalm, complexity, Unit, Conformance, security
        run: composer check

      - name: Integration (Redis, APCu, filesystem)
        run: composer test-integration

      - name: Mutation testing
        run: composer infection

      - name: SBOM
        run: composer sbom

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
