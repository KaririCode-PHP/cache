# Spec V4.3.3 quality gate (§29.1) in CI. Actions and the service image are
# pinned by commit SHA / digest (§32; OWASP Top 10:2025 A03, CVE-2025-30066).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: Gate · PHP 8.4 · Redis 7.4
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KARIRICODE_CACHE_REDIS_HOST: 127.0.0.1
      KARIRICODE_CACHE_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: redis, apcu, igbinary, zlib
          ini-values: apc.enable_cli=1
          coverage: pcov
          tools: composer:v2

      # kariricode/contract 2.11.0 comes from tools/contract-2.11-fixture
      # (path repository) until it is published on Packagist.
      - name: Install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Style, PHPStan (+ cognitive), Psalm, complexity, Unit, Conformance, security
        run: composer check

      - name: Integration (Redis, APCu, filesystem)
        run: composer test-integration

      - name: Mutation testing
        run: composer infection

      - name: SBOM
        run: composer sbom

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
